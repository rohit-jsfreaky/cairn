[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cairn"
version = "0.1.0"
description = "A browser memory for AI agents: learn a site once, replay the trail with no model calls."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Rohit Kashyap" }]
dependencies = [
    "sibyl-memory-client>=0.8.0",
    "playwright>=1.62.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fastapi>=0.141.1", "uvicorn>=0.52.4"]

[project.scripts]
cairn = "cairn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
